<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6750a4">
<title>AI 照相馆</title>
<style>
  :root{--bg:#f7f7fb;--card:#fff;--ink:#1f1f28;--muted:#6b6b7b;--line:#e3e3ec;--brand:#6750a4;--brand2:#3f2b6e;--ok:#1b7f4b;--err:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;padding-bottom:30px}
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:16px 14px 12px;position:sticky;top:0;z-index:9}
  header h1{margin:0;font-size:19px;display:flex;align-items:center;justify-content:space-between}
  header p{margin:5px 0 0;font-size:11px;opacity:.85}
  .iconbtn{background:#ffffff2b;border:0;color:#fff;border-radius:9px;padding:7px 11px;font-size:13px}
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 10px 4px;position:sticky;top:66px;z-index:8;background:var(--bg);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  main{padding:6px 10px 20px}
  .panel{display:none}.panel.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:9px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--brand2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:14px;background:#fff;color:var(--ink)}
  .field textarea{min-height:62px;resize:vertical}
  .field .hint{font-size:10px;color:var(--muted)}
  .check{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
  .check input{width:19px;height:19px;accent-color:var(--brand)}
  .wide{grid-column:1/-1}
  .btn{border:0;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:600;width:100%;background:var(--brand);color:#fff}
  .btn.secondary{background:#ece8f7;color:var(--brand2)}
  .btn.ghost{background:#fff;color:var(--brand2);border:1px solid var(--line)}
  .btn.small{padding:8px 10px;font-size:12px;width:auto}
  .row{display:flex;gap:8px;margin-top:9px}.row .btn{flex:1}
  .picked{margin-top:7px;max-width:170px;border-radius:9px;display:none}
  #result{margin-top:12px}
  .msg{padding:11px;border-radius:10px;font-size:13px;white-space:pre-wrap;word-break:break-all}
  .msg.ok{background:#e8f5ee;color:var(--ok)}.msg.err{background:#fdecea;color:var(--err)}
  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:9px;margin-top:9px}
  .imgs .item{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
  .imgs img{width:100%;display:block;aspect-ratio:3/4;object-fit:contain;background:#f0f0f5}
  .imgs .cap{padding:6px;text-align:center;font-size:11px;color:var(--muted)}
  details{margin-top:9px;font-size:11px;color:var(--muted)}
  summary{cursor:pointer}
  pre{white-space:pre-wrap;word-break:break-all;background:#f4f4f8;padding:9px;border-radius:9px;max-height:240px;overflow:auto}
  .foot{text-align:center;color:var(--muted);font-size:11px;padding:16px 8px}
  #settingsPanel{position:fixed;inset:0;background:#0008;z-index:20;overflow:auto;display:none}
  #settingsPanel .card{margin:36px 10px;max-width:560px;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<header>
  <h1>📷 AI 照相馆 <button class="iconbtn" onclick="openSettings()">⚙ 设置</button></h1>
  <p>证件照 · 换背景 · 精修 · 写真 · 修复 · 扩图 · 文生图 · 批量</p>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div class="foot">图像由 Agnes AI 处理 · 设置仅保存在本机 · 结果保存到「下载/AIPhotoStudio」</div>

<div id="settingsPanel">
  <div class="card">
    <h2>设置（API Key 只存本机）</h2>
    <div id="settingsForm"></div>
    <div class="row"><button class="btn secondary" onclick="saveSettings()">保存</button>
      <button class="btn ghost" onclick="testConnection()">测试连接</button></div>
    <div class="row"><button class="btn ghost" onclick="closeSettings()">关闭</button></div>
    <div id="settingsMsg" style="margin-top:9px"></div>
  </div>
</div>

<script src="schema.js"></script>
<script src="prompts.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
