<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6750A4">
<title>AI 照相馆</title>
<style>
:root{
  --bg:#F5F4F9; --card:#FFFFFF; --ink:#1F1B2E; --muted:#6E6A80; --line:#E7E3F0;
  --brand:#6750A4; --brand2:#3F2B6E; --brand-soft:#EDE7F8; --ok:#1B7F4B; --err:#B3261E;
  --shadow:0 3px 14px rgba(40,20,80,.08); --radius:20px;
}
html[data-theme="dark"]{
  --bg:#0E0E13; --card:#1B1B24; --ink:#ECE9F5; --muted:#A9A4BC; --line:#33313F;
  --brand:#B39DDB; --brand2:#D0BCFF; --brand-soft:#2E2640; --ok:#66BB8A; --err:#EF9A9A;
  --shadow:0 3px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit}

/* App Bar */
.appbar{position:sticky;top:0;z-index:30;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  box-shadow:0 3px 16px rgba(0,0,0,.2)}
.appbar .bar{display:flex;align-items:center;gap:12px}
.appbar .logo{width:38px;height:38px;border-radius:11px;background:#ffffff2b;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.appbar .title{flex:1;font-size:19px;font-weight:700;line-height:1.2}
.appbar .title small{display:block;font-size:11px;opacity:.85;font-weight:400;margin-top:2px}
.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:#ffffff24;color:#fff;
  font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.icon-btn:active{background:#ffffff45}

main{padding:14px 14px 8px;max-width:680px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 12px;color:var(--brand);display:flex;align-items:center;gap:8px}
.card .step-badge{font-size:12px;background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:2px 8px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;
  padding:11px;font-size:15px;background:var(--bg);color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{min-height:72px;resize:vertical}
.field .hint{font-size:11px;color:var(--muted)}
.wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px;min-height:34px}
.check input{width:21px;height:21px;accent-color:var(--brand);flex:0 0 auto}

.color-row{display:flex;gap:8px;align-items:center}
.color-row input[type=color]{width:54px;height:44px;padding:2px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.color-row input[type=text]{flex:1}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch:active{transform:scale(.88)}

.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;accent-color:var(--brand);height:24px}
.range-val{min-width:34px;text-align:center;font-size:13px;color:var(--brand);font-weight:700}
.range-preview{margin:8px 0 4px;display:flex;gap:10px;align-items:flex-start}
.range-preview img{width:110px;height:140px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

.example-box{position:relative}
.example-btn{position:absolute;right:8px;top:30px;font-size:11px;color:var(--brand);
  background:var(--brand-soft);border:0;border-radius:8px;padding:4px 8px;cursor:pointer}

.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.style-card{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;background:var(--bg)}
.style-card.active{border-color:var(--brand);background:var(--brand-soft)}
.style-card .em{font-size:24px;display:block}
.style-card .nm{font-size:12px;font-weight:700;margin-top:4px}
.style-card .ds{font-size:10px;color:var(--muted);margin-top:2px}

/* 子标签（修图/创作） */
.subtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.subtab.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.subview{display:none}.subview.active{display:block}

.btn{border:0;border-radius:14px;padding:14px;width:100%;font-size:16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn:active{opacity:.86}
.btn.secondary{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:var(--card);color:var(--brand);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:12px;width:auto}
.btn.danger{background:rgba(179,38,30,.12);color:var(--err)}
.row{display:flex;gap:10px;margin-top:10px}.row .btn{flex:1}
.picked{margin-top:8px;max-width:150px;border-radius:12px;display:none}

/* 进度条 */
.progress{margin-top:12px;display:none}
.progress .track{height:8px;border-radius:8px;background:var(--brand-soft);overflow:hidden}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0%;transition:width .3s}
.progress .txt{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}

.msg{padding:12px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-break:break-all}
.msg.ok{background:rgba(27,127,75,.12);color:var(--ok)}
.msg.err{background:rgba(179,38,30,.12);color:var(--err)}
.msg.info{background:var(--brand-soft);color:var(--brand)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-top:10px}
.imgs .item{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.imgs .item img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--bg);cursor:zoom-in}
.imgs .cap{padding:6px;text-align:center;font-size:11px;color:var(--muted)}
.imgs .item .btn{margin:0 6px 6px;width:calc(100% - 12px)}
details{margin-top:10px;font-size:12px;color:var(--muted)}summary{cursor:pointer}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:10px;max-height:220px;overflow:auto}

/* 历史 */
.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.history-item{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);cursor:zoom-in}
.history-item img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.history-item .cap{padding:5px;font-size:10px;color:var(--muted);text-align:center}

/* 底部导航 */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(0,0,0,.06)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;
  color:var(--muted);cursor:pointer;border:0;background:none;font-size:10px}
.nav-item .ic{font-size:19px;line-height:1}
.nav-item.active{color:var(--brand);font-weight:700}

/* 抽屉 / 弹层 */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84vh;overflow:auto;
  background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 14px;font-size:18px;color:var(--brand)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;padding:10px;border:0;background:var(--bg);color:var(--muted);cursor:pointer;font-size:13px}
.seg button.active{background:var(--brand);color:#fff}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;
  align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lightbox img{max-width:100%;max-height:82vh;border-radius:8px}
.lightbox .lbbar{display:flex;gap:10px;margin-top:16px;width:100%;max-width:420px}
.lightbox .lbbar .btn{flex:1}
.lightbox .close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;
  width:42px;height:42px;border-radius:50%;border:0;background:#ffffff2b;color:#fff;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<header class="appbar">
  <div class="bar">
    <div class="logo">📷</div>
    <div class="title">AI 照相馆<small id="appSub">让每一张照片都惊艳</small></div>
    <button class="icon-btn" onclick="openHistory()" aria-label="历史">🕘</button>
    <button class="icon-btn" onclick="openSettings()" aria-label="设置">⚙</button>
  </div>
</header>

<main id="main"><div class="card" id="bootMsg" style="text-align:center;color:var(--muted)">正在加载界面…</div></main>
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- 设置抽屉 -->
<div class="sheet-mask" id="settingsSheet">
  <div class="sheet">
    <h2>⚙ 设置</h2>
    <div class="seg" id="themeSeg">
      <button data-theme="light">☀️ 浅色</button>
      <button data-theme="dark">🌙 深色</button>
      <button data-theme="system">📱 跟随系统</button>
    </div>
    <div id="settingsForm"></div>
    <div class="row"><button class="btn secondary" onclick="saveSettings()">保存设置</button>
      <button class="btn ghost" onclick="testConnection()">测试连接</button></div>
    <div class="row"><button class="btn ghost" onclick="closeSettings()">关闭</button></div>
    <div id="settingsMsg" style="margin-top:10px"></div>
  </div>
</div>

<!-- 历史抽屉 -->
<div class="sheet-mask" id="historySheet">
  <div class="sheet">
    <h2>🕘 生成历史 <span id="historyCount" style="font-size:12px;color:var(--muted)"></span></h2>
    <div class="row"><button class="btn danger" onclick="clearHistory()">清空历史</button>
      <button class="btn ghost" onclick="closeHistory()">关闭</button></div>
    <div id="historyGrid" class="history-grid" style="margin-top:14px"></div>
    <div id="historyEmpty" style="text-align:center;color:var(--muted);padding:30px;display:none">暂无历史记录</div>
  </div>
</div>

<!-- 大图预览 -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="预览">
  <div class="lbbar"><button class="btn" id="lbSave">保存到相册</button></div>
</div>

<script>
window.__bootCheck=setTimeout(function(){
  var b=document.getElementById('bootMsg');
  if(b&&b.parentNode)b.innerHTML='<div class="card" style="border-color:#B3261E"><h2 style="color:#B3261E">⚠️ 界面脚本未加载</h2><p>请确认安装的是最新版 APK（v2.1）。</p></div>';
},6000);
</script>
<script src="schema.js"></script>
<script src="prompts.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
