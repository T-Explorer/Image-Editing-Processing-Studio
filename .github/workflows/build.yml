name: Build AI Photo Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 35
        shell: bash
        run: |
          SDKROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDKROOT" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          echo "========== KOTLIN / COMPILE ERRORS =========="
          grep -n -E '^e:|error:|FAILURE:|What went wrong|Unresolved reference|Compilation error|Caused by:' build.log | head -60 || true
          echo "=============================================="

      - name: Upload build log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photo-Studio-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
